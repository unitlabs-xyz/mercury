# Static hosting for the built admin SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Internal, and never a search result. The meta tag in index.html says the
  # same thing; this one reaches a crawler that never parses the HTML.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Vite writes a content hash into every filename under /assets, so a file
  # that changes arrives under a new name and the old one can be kept forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html names the hashed assets. A cached copy would go on naming files
  # that the next deploy deleted, so this one is always revalidated.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # One page, so everything lands on it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
