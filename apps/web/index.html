<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Harbor — your investment account, in your own wallet</title>
    <meta
      name="description"
      content="Buy real shares of Nvidia, Apple or the S&amp;P 500 with stablecoins. No brokerage account, no bank transfer, and no minimum beyond a few dollars."
    />
    <meta name="theme-color" content="#F7F6F2" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Relative og:image resolves against the page URL. Add og:url and swap
         these to absolute URLs once the domain is settled. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harbor" />
    <meta property="og:title" content="Your investment account, in your own wallet" />
    <meta
      property="og:description"
      content="Buy real shares of Nvidia, Apple or the S&amp;P 500 with stablecoins. No brokerage account, no bank transfer, and no minimum beyond a few dollars."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Harbor — your investment account, in your own wallet. 590 US stocks and funds, any hour of the week."
    />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your investment account, in your own wallet" />
    <meta
      name="twitter:description"
      content="Buy real shares of Nvidia, Apple or the S&amp;P 500 with stablecoins. No brokerage account, no bank transfer."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
