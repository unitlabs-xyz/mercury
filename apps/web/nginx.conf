# Static hosting for the built SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The main bundle is ~3MB uncompressed and ~865KB gzipped, so this is not a
  # micro-optimisation — it is most of the page weight. woff2 and png are
  # already compressed and are left alone.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Vite writes a content hash into every filename under /assets, so a file
  # that changes arrives under a new name and the old one can be kept forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fonts are preloaded by index.html and carry no hash, so they get a long but
  # revalidatable life rather than an immutable one.
  location /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
  }

  # index.html names the hashed assets. A cached copy would go on naming files
  # that the next deploy deleted, so this one is always revalidated.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Every route is client-side: /portfolio and /invest/AAPL are not files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
