# Loki, as the image ships it, plus log retention.
#
# Taken verbatim from grafana/otel-lgtm with `docker run --rm --entrypoint cat
# grafana/otel-lgtm:latest /otel-lgtm/loki-config.yaml`, and edited — not
# written by hand. The image's config changes between versions and a partial
# one does not start; if a Loki upgrade breaks this, diff it against the
# image's current file rather than guessing.
#
# This file exists because retention is NOT a Loki flag. `LOKI_EXTRA_ARGS`
# looks like the place for it — Prometheus takes its retention that way — but
# `--limits.retention-period` makes Loki exit at startup with "flag provided
# but not defined", and the container then dies with "Error: Loki exited
# before becoming ready". Retention is config only, and both halves below are
# required: a `retention_period` with no `retention_enabled` compactor is a
# setting that silently does nothing.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# A month of logs, and a compactor that actually enforces it.
#
# `retention_enabled: true` is the half people miss. Without it Loki accepts
# `retention_period`, reports no error, and deletes nothing — the disk fills
# and the setting looks correct in the config all the while.
#
# `delete_request_store` is required once retention is on; Loki refuses to
# start without it.
limits_config:
  retention_period: 720h

compactor:
  working_directory: /data/loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
