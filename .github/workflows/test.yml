name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Offline by design. Every adapter test answers from a recorded fixture,
      # and the live tests (*.live.test.ts) are excluded from `pnpm test` — they
      # need a mainnet RPC and are run by hand. See docs/superpowers/plans.
      - run: pnpm -r test
